<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CDC · Hỏi đáp tài liệu</title>
<style>body{font:16px system-ui;background:#eef3f7;color:#162c40;max-width:950px;margin:40px auto;padding:20px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}textarea,input{display:block;width:95%;padding:12px;margin:10px 0;border:1px solid #9ab0bf;border-radius:6px}button{background:#155d82;color:white;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#436074}</style>
<h1>Hỏi đáp tài liệu</h1><small>BM25 · câu trả lời trích nguyên văn · dữ liệu lưu trên máy của bạn</small>
<section><h2>1. Thêm hoặc cập nhật tài liệu</h2><label>Mã tài liệu<input id="docId" placeholder="cdc-runbook"></label><label>Tiêu đề<input id="title" placeholder="Hướng dẫn CDC"></label><label>File UTF-8 (.txt, .md)<input type="file" id="file" accept=".txt,.md"></label><label>Nội dung<textarea id="content" rows="5"></textarea></label><button id="save">Lưu tài liệu</button> <button id="list">Danh sách</button><pre id="docs" role="status"></pre></section>
<section><h2>2. Đặt câu hỏi</h2><label>Câu hỏi<input id="question" placeholder="Kafka consumer xử lý retry như thế nào?"></label><button id="ask">Tìm câu trả lời</button><p id="status" role="status"></p><div id="answer"></div><div id="sources"></div><small>Kết quả là đoạn có từ khóa phù hợp, chưa có LLM tổng hợp hoặc kiểm chứng ngữ nghĩa. Có thể khớp sai nếu chỉ trùng từ thông dụng.</small></section>
<script>
const el=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
el('file').onchange=async()=>{const f=el('file').files[0];if(f)el('content').value=await f.text()};
el('save').onclick=async()=>{try{const r=await api('/api/documents',{id:el('docId').value,title:el('title').value,text:el('content').value});el('docs').textContent=`Đã lưu ${r.id}: ${r.chunks} đoạn`}catch(e){el('docs').textContent=e.message}};
el('list').onclick=async()=>{try{el('docs').textContent=JSON.stringify(await api('/api/documents'),null,2)}catch(e){el('docs').textContent=e.message}};
el('ask').onclick=async()=>{el('ask').disabled=true;el('status').textContent='Đang tìm…';el('answer').replaceChildren();el('sources').replaceChildren();try{const r=await api('/api/ask',{question:el('question').value});el('status').textContent=`${r.latency_ms} ms · ${r.citations.length} nguồn`;const p=document.createElement('pre');p.textContent=r.answer;el('answer').append(p);for(const c of r.citations){const d=document.createElement('details'),s=document.createElement('summary'),q=document.createElement('pre');s.textContent=`[${c.label}] ${c.title} · ${c.document_id} · từ ${c.word_offset} · ${c.chunk_id}`;q.textContent=c.quote;d.append(s,q);el('sources').append(d)}}catch(e){el('status').textContent=e.message}finally{el('ask').disabled=false}};
</script></html>
