name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore cdc.sln

      - name: Build
        run: dotnet build cdc.sln --configuration Release --no-restore

      - name: Test with coverage
        id: tests
        run: >
          dotnet test cdc.sln
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Install coverage report tool
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.18

      - name: Generate coverage summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"CoverageReport"
          -reporttypes:"TextSummary;MarkdownSummaryGithub"

      - name: Show coverage in output
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          if [[ ! -f CoverageReport/Summary.txt || ! -f CoverageReport/SummaryGithub.md ]]; then
            echo "::error::Coverage summary was not generated. Check the test and report steps."
            echo "### Code coverage unavailable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat CoverageReport/Summary.txt
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  document-qa:
    name: Document QA tests and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API, retrieval and evaluation tests
        run: python -m unittest discover -s document_qa/tests -v
      - name: Evaluation quality gate
        run: python -m document_qa.evaluate
      - name: HTTP performance smoke report
        run: python -m document_qa.benchmark --requests 20 --concurrency 2 --warmup 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-qa-evaluation
          path: |
            artifacts/document-qa-evaluation.json
            artifacts/document-qa-benchmark.json

  integration:
    name: Document QA process integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s document_qa/integration_tests -v

  container:
    name: Build and test deployment image
    needs: [test, document-qa, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -f document_qa/Dockerfile -t document-qa:test .
      - name: Container HTTP lifecycle and persistent volume
        env:
          QA_TEST_IMAGE: document-qa:test
        run: python -m unittest discover -s document_qa/integration_tests -v
      - name: Save tested image
        run: docker save document-qa:test -o document-qa-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: document-qa-image
          path: document-qa-image.tar
          retention-days: 3

  publish:
    name: Publish tested image to GHCR
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: document-qa-image
      - name: Publish immutable commit tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}/document-qa"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker load -i document-qa-image.tar
          docker tag document-qa:test "$image:$REVISION"
          docker push "$image:$REVISION"
          echo "Published $image:$REVISION; deploy using its registry digest." >> "$GITHUB_STEP_SUMMARY"
